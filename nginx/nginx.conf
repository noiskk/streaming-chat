upstream backend_blue {
    server sw_team_1-backend-blue:8080;
}

server {
    listen 8002;

    # 프론트엔드
    location / {
        proxy_pass http://sw_team_1-frontend:80;
    }

    # 백엔드 API + SSE 스트리밍
    location /chat {
        proxy_pass http://backend_blue;
        proxy_set_header Connection '';
        proxy_http_version 1.1;
        proxy_buffering off;        # SSE 필수: 버퍼링 끄기
        proxy_cache off;
        proxy_read_timeout 300s;    # 스트리밍 연결 유지
    }
}
